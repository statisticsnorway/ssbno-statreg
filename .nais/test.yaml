apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: ssbno-developers
  name: ssbno-statreg-api
  namespace: ssbno
spec:
# TODO: 
#  accessPolicy:
#    inbound:
#      external:
#        - host: i.qa.ssb.no
#          ports:
#            - port: 443
#  env:
#  - name: API_HOST
#    value: https://i.qa.ssb.no
  gcp:
      sqlInstances:
        - type: POSTGRES_17
# See Nais docs: https://docs.ssb.cloud.nais.io/workloads/application/reference/application-spec/#gcpsqlinstancestier
          tier: db-f1-micro # This tier MUST be increased for PROD! No SLA unless custom!
          diskAutoresize: true
          diskAutoresizeLimit: 50
          flags:
            - name: "cloudsql.enable_pgaudit"
              value: "on"
            - name: "pgaudit.log"
              value: "write"
            - name: "pgaudit.log_parameter"
              value: "on"          
          databases:
            - name: statreg-db
  image: '{{ image }}' # Injected from the GitHub Action
  ingresses:
  - https://ssbno-statreg-api.intern.test.ssb.no
  logformat: accesslog_with_referer_useragent
  logtransform: http_loglevel
  port: 8080
  prometheus:
    enabled: true
    path: /metrics
    port: "9000"
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
  liveness:
    failureThreshold: 10
    initialDelay: 20
    path: /live
    periodSeconds: 5
    port: 9000
    timeout: 1
  readiness:
    failureThreshold: 10
    initialDelay: 20
    path: /ready
    periodSeconds: 5
    port: 9000
    timeout: 1
  replicas:
    max: 2
    min: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  terminationGracePeriodSeconds: 60
status: {}