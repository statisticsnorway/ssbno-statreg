apiVersion: data.nais.io/v1
kind: Postgres
metadata:
  name: statreg-api-test-db
  namespace: ssbno
spec:
  cluster:
    audit:
      enabled: true
    majorVersion: '17'
    resources:
      cpu: 200m
      diskSize: 2Gi
      memory: 2Gi
  database:
    collation: nb_NO

---
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: ssbno-developers
  name: ssbno-statreg
  namespace: ssbno

spec:
  ingresses:
    - https://ssbno-statreg.intern.test.ssb.no
  image: '{{ image }}' # Injected from the GitHub Action
  port: 8080

  envFrom:
    - secret: login-config-ssbno-statreg
    - secret: statreg-secrets
    - configmap: statreg-config

  env:
    - name: NODE_ENV
      value: production
    - name: AUTH_ENABLED
      value: 'true'
    - name: KEYCLOAK_CLIENT_ID
      value: ssbno-statreg
    - name: KLASS_BASE_URL
      value: https://data.qa.ssb.no
    - name: KEYCLOAK_REALM_ISSUER
      value: https://auth.test.ssb.no/realms/ssb
    - name: KEYCLOAK_JWKS_URI
      value: https://auth.test.ssb.no/realms/ssb/protocol/openid-connect/certs
    - name: KEYCLOAK_TOKEN_AUDIENCE
      value: oauth2-proxy-ssbno-statreg

  accessPolicy:
    outbound:
      external:
        - host: auth.test.ssb.no
        - host: data.qa.ssb.no

  login:
    provider: openid
    enforce:
      enabled: true
      excludePaths:
        - /statistikkregisteret/docs
        - /statistikkregisteret/docs/**
        - /statistikkregisteret/api
        - /statistikkregisteret/api/**

  resources:
    requests:
      cpu: 1Gi
      memory: 4Gi

  postgres:
    clusterName: statreg-api-test-db

  prometheus:
    enabled: true
    path: /metrics
    port: '9000'

  liveness:
    path: /live
    port: 9000
    failureThreshold: 3
    initialDelay: 10
    periodSeconds: 30
    timeout: 5

  readiness:
    path: /ready
    port: 9000
    failureThreshold: 1
    initialDelay: 5
    periodSeconds: 5
    timeout: 5

  startup:
    path: /live
    port: 9000
    failureThreshold: 3
    initialDelay: 10
    periodSeconds: 30
    timeout: 5
status: {}
