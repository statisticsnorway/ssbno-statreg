openapi: 3.1.0
# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2022-10-07
info:
  title: Statreg API
  version: 0.1.0
  description: API for managing publications, statistics and metadata for Statistics Norway. This API is under development, and there will be breaking changes.
servers:
  - url: https://ssbno-statreg-api.intern.test.ssb.no
  - url: http://localhost:8080

tags:
  - name: calendar
    description: Helpers for calendar view and days that are blocked
  - name: frequencies
    description: Frequencies for releases, ie. copled to variants of a statistic
  - name: releases
    description: Releases endpoints
  - name: statistics
    description: Statistics information and manipulation

security:
  - keykloak_token: []

components:
  securitySchemes:
    keykloak_token:
      type: http
      scheme: bearer
      description: A token granted by Statistics Norway's Keycloak instance for ssbno-statreg-api.

  schemas:
    Blocked_release_date:
      type: object
      properties:
        date: { type: string, format: date-time }
        blocked_comment: { type: string }

    Calender_date:
      type: object
      properties:
        date: { type: string, format: date-time }
        is_blocked: { type: boolean, readOnly: true }
        blocked_comment: { type: string, nullable: true, readOnly: true }
        releases:
          type: array
          items:
            type: object
            properties:
              release_id: { type: integer, readOnly: true }
              statistic_shortname: { type: string, readOnly: true }
              statistic_name: { $ref: '#/components/schemas/Translations', readOnly: true }

    Contact:
      type: object
      properties:
        name: { type: string, readOnly: true }
        username: { type: string, readOnly: true }
        mobile: { type: string, format: mobile, readOnly: true }
        email: { type: string, format: email, readOnly: true }

    Frequency:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        name: { $ref: '#/components/schemas/Translations' }
        code: { type: string }

    Release:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        publish_time: { type: string, format: date-time }
        period_to: { type: string, format: date-time }
        period_from: { type: string, format: date-time }

    Release_create:
      allOf:
        - $ref: '#/components/schemas/Release'
        - type: object
          properties:
            release_date_precision: { type: string }

    Release_update:
      allOf:
        - $ref: '#/components/schemas/Release'
        - type: object
          properties:
            comment: { type: string }
            release_date_precision: { type: string }

    Release_get:
      allOf:
        - $ref: '#/components/schemas/Release'
        - type: object
          properties:
            approval_status: { type: [string, 'null'] }
            statistic:
              type: object
              properties:
                shortname: { type: string, readOnly: true }
                name: { $ref: '#/components/schemas/Translations', readOnly: true }

    Release_details:
      allOf:
        - $ref: '#/components/schemas/Release_get'
        - type: object
          properties:
            has_versions: { type: boolean }
            variant:
              type: object
              properties:
                id: { type: integer, readOnly: true }
                frequency:
                  type: object
                  properties:
                    name: { $ref: '#/components/schemas/Translations', readOnly: true }
                revision:
                  type: object
                  properties:
                    name: { $ref: '#/components/schemas/Translations', readOnly: true }
            cancelled: { type: boolean }
            release_date_precision: { type: string }

    Release_listing:
      allOf:
        - $ref: '#/components/schemas/Release_get'
        - type: object
          properties:
            frequency:
              type: object
              properties:
                name: { $ref: '#/components/schemas/Translations', readOnly: true }

    Statistic:
      type: object
      properties:
        shortname: { type: string, readOnly: true }
        main_language: { type: string, description: "Main language will be either 'nn' or 'nb' for statistics" }
        status:
          type: object
          properties:
            code: { type: string }
        name: { $ref: '#/components/schemas/Translations' }
        approval_status: { type: string, description: " Is one of 'GODKJENT', 'AVVIST' or 'FORSLAG'" }

    Statistic_create:
      allOf:
        - $ref: '#/components/schemas/Statistic'
      type: object
      properties:
        division: { type: string, nullable: true }
        first_released_at:  { type: string, format: date, nullable: true }
        yearly_reporting: { type: boolean}
        statistic_region_levels:
          type: array
          items: { type: string }
          description: 'Array with region levels. Valid region levels are K (kommune), F (fylke), LD (landsdel), L (land) and BD (Bydel og krets)'
        previous_topic_codes: { type: string, nullable: true }

    Statistic_update:
      allOf:
        - $ref: '#/components/schemas/Statistic'
      type: object
      properties:
        division: { type: string, nullable: true }
        first_released_at:  { type: string, format: date, nullable: true }
        yearly_reporting: { type: boolean}
        statistic_region_levels:
          type: array
          items: { type: string }
          description: 'Array with region levels. Valid region levels are K (kommune), F (fylke), LD (landsdel), L (land) and BD (Bydel og krets)'
        previous_topic_codes: { type: string, nullable: true }
        relation:  { type: string, nullable: true }
        comment: {type: string}

    Statistic_details:
      allOf:
        - $ref: '#/components/schemas/Statistic'
      type: object
      properties:
        version: { type: integer }
        division:
          type: object
          properties:
            code: { type: string, nullable: true }
            name: { $ref: '#/components/schemas/Translations', readOnly: true }
        first_released_at: { type: string, format: date, nullable: true }
        yearly_reporting: { type: boolean }
        previous_topic_codes: { type: string, nullable: true }
        relation:
          type: object
          properties:
            shortname: { type: string }
            name: { $ref: '#/components/schemas/Translations', readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        comment: { type: string }
        created_at: { type: string, format: date-time, readOnly: true }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }
        contacts:
          type: array
          items:
            type: object
            properties:
              username: { type: string, nullable: true }
              email: { type: string }
              name: { type: string }
        statistic_region_levels:
          type: array
          items: { $ref: '#/components/schemas/Translations' }

    Statistic_listing:
      allOf:
        - $ref: '#/components/schemas/Statistic'
      type: object
      properties:
        contacts:
          type: array
          items:
            type: object
            properties:
              username: { type: string, nullable: true }
              email: { type: string }

    Translations:
      type: array
      items:
        type: object
        properties:
          language_code: { type: string }
          text: { type: string }

    Variant:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        version: { type: integer }
        updated_at: { type: string, format: date-time, readOnly: true }
        level_of_detail:
          type: object
          properties:
            name: { $ref: '#/components/schemas/Translations', nullable: true }
        created_at: { type: string, format: date-time, readOnly: true }
        cancelled: { type: boolean }
        freqency:
          type: object
          properties:
            name: { $ref: '#/components/schemas/Translations', readOnly: true }
        revision: { type: string }

paths:
  /statistics:
    get:
      summary: List of all statistics
      security: []
      tags: [statistics]
      responses:
        '200':
          description: List of statistics
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Statistic_listing' }
    post:
      summary: Create a new statistic
      tags: [statistics]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Statistic_create' }
      responses:
        '201':
          description: Statistic details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistic_details' }
  /statistics/{shortname}:
    get:
      summary: Get a statistic by its shortname
      security: []
      tags: [statistics]
      parameters:
        - name: shortname
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Statistic details with all its variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistic_details' }
    put:
      summary: Update a statistic
      tags: [statistics]
      parameters:
        - name: shortname
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Statistic_update' }
      responses:
        '200':
          description: Updated statistic details with all its variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistic_details' }
  /statistics/{shortname}/variants:
    post:
      summary: Create a variant on a spesific statistic
      tags: [statistics]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Variant' }
      responses:
        '201':
          description: The created variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
  /statistics/{shortname}/variants/{id}:
    put:
      summary: Update a variant
      tags: [statistics]
      parameters:
        - name: shortname
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Variant' }
      responses:
        '200':
          description: Updated variant details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
  /statistics/{shortname}/variants/{id}/releases:
    post:
      summary: Create a new release
      tags: [statistics]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Release_create' }
      responses:
        '201':
          description: Release details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release_details' }
  /statistics/{shortname}/versions:
    get:
      summary: List all versions with changes and comment. Response object TBD
      tags: [statistics]
      responses:
        '200':
          description: List of versions. Response object TBD
          content:
            application/json:
              schema: {}

  /releases:
    get:
      summary: List all releases. TBD; Pagination and filtering in backend or frontend
      security: []
      tags: [releases]
      responses:
        '200':
          description: List of releases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Release_listing' }
  /releases/{id}:
    get:
      summary: Get release by id
      security: []
      tags: [releases]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Release details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release_details' }
    put:
      summary: Update a release
      tags: [releases]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Release_update' }
      responses:
        '200':
          description: Updated release details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release_details' }
  /releases/{id}/versions:
    get:
      summary: List all versions on a release with change and comment. Response object TBD
      tags: [releases]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of versions. Response object TBD
          content:
            application/json:
              schema: {}

  /frequencies:
    get:
      summary: List all frequencies
      tags: [frequencies]
      responses:
        '200':
          description: List of frequencies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Frequency' }

  /calendar:
    get:
      summary: List all days within date range with releases, statuses, nonreleaseing days and reasons using defult parameters
      security: []
      tags: [calendar]
      responses:
        '200':
          description: List of days
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Calender_date' }
  /calendar/{fromdate}-{todate}:
    get:
      summary: List all days within date range with releases, statuses, nonreleaseing days and reasons
      security: []
      tags: [calendar]
      parameters:
        - name: fromdate
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: todate
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of days in range
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Calender_date' }
  /calendar/blocked-release-days:
    get:
      summary: List with all manually added blocked days
      tags: [calendar]
      responses:
        '200':
          description: List with blocked days
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Blocked_release_date' }
  /calendar/blocked-release-days/{date}:
    post:
      summary: Manually block a day
      tags: [calendar]
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blocked_comment:
                  type: string
      responses:
        '200':
          description: Updated list with blocked days
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Blocked_release_date' }
    delete:
      summary: Delete a manually blocked day
      tags: [calendar]
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Updated list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Blocked_release_date' }
