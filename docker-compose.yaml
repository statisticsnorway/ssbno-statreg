services:
  postgres:
    image: postgres:18
    container_name: statreg-db
    environment:
      POSTGRES_USER: cob
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: statregdb
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./schema/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
