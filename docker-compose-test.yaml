services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: statreg_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d statreg_db']
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    image: node:24
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    command: >
      sh -c "
      npm ci &&
      npm run generate &&
      npm run build &&
      npm run db:deploy -w backend &&
      npm run seed -w backend &&
      npm run start -w backend
      "
    environment:
      NODE_ENV: test
      PGURL: postgresql://test_user:test_pass@db:5432/statreg_db?sslmode=disable
      AUTH_ENABLED: 'false'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/docs']
      interval: 2s
      timeout: 2s
      retries: 30

  tests:
    image: node:24
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    environment:
      NODE_ENV: test
      API_URL: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    command: >
      sh -c "
      npm ci &&
      npm run test:integration -w backend
      "

volumes:
  root_node_modules:
