version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: test_db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PGURL: postgresql://test_user:test_pass@db:5432/test_db
      NODE_ENV: test
    depends_on:
      - db
    command: sh -c "npm run db:deploy && npm run test:integration"