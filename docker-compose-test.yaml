services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: statreg_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d statreg_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  tests:
    image: ghcr.io/pnpm/pnpm:11.22.0
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
    environment:
      NODE_ENV: test
      PGURL: postgresql://test_user:test_pass@db:5432/statreg_db?sslmode=disable
      AUTH_ENABLED: "false"
      MOCK_ENTRA_USERS: "true"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pnpm runtime set node 24 -g 
      && pnpm install 
      && pnpm run generate 
      && pnpm run build 
      && pnpm run --filter "backend" db:deploy 
      && pnpm run --filter "backend" seed
      && pnpm run --filter "backend" test:integration"

volumes:
  root_node_modules:
