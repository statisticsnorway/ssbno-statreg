version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: statreg_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d statreg_db']
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    image: node:24
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "
      npm ci &&
      npm run generate &&
      npm run build &&
      npm run db:deploy &&
      npm run seed &&
      npm run start
      "
    environment:
      NODE_ENV: test
      PGURL: &test_pgurl postgresql://test_user:test_pass@db:5432/statreg_db?sslmode=disable
      AUTH_ENABLED: 'false'
      MOCK_ENTRA_USERS: 'true'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/docs'] # TODO proper health check here
      interval: 2s
      timeout: 2s
      retries: 30

  tests:
    image: node:24
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: test
      API_URL: http://app:8080
      PGURL: *test_pgurl
    depends_on:
      app:
        condition: service_healthy
    command: >
      sh -c "
      npm ci &&
      npm run test:integration
      "

volumes:
  node_modules:
