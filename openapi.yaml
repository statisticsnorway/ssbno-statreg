openapi: 3.0.4
info:
  title: Statistikkregisteret API
  version: "1.0"
  description: API and UI endpoints for statistics and publications used by Statistikkregisteret.

paths:
  /statistics:
    get:
      summary: List all statistics (JSON)
      operationId: listStatistics
      description: Returns all active statistics and their non-discontinued variants.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
              examples:
                example:
                  value:
                    statistics:
                      - id: 4110
                        shortName: "lonnvare"
                        name: "Lønn for ansatte i varehandel"
                        nameEN: "Earnings in domestic trade and repair of goods"
                        modifiedTime: "2019-08-26 12:42:22.056"
                        status: "SA"
                        variants:
                          - id: 9114
                            frekvens: "År"
                            previousRelease: "2014-12-09 10:00:00.0"
                            previousFrom: "2014-09-01 00:00:00.0"
                            previousTo: "2014-09-01 00:00:00.0"
                            nextRelease: ""
                            nextReleaseId: ""
                            upcomingReleases: []
                      - id: 4156
                        shortName: "kpi"
                        name: "Konsumprisindeksen"
                        nameEN: "Consumer price index"
                        modifiedTime: "2021-01-05 09:31:46.087"
                        status: "A"
                        variants:
                          - id: 8870
                            frekvens: "Måned"
                            previousRelease: "2024-12-10 08:00:00.0"
                            previousFrom: "2024-11-01 00:00:00.0"
                            previousTo: "2024-11-30 00:00:00.0"
                            nextRelease: ""
                            nextReleaseId: ""
                            upcomingReleases:
                              - id: 90001
                                publishTime: "2025-03-01 08:00:00.0"
                                periodFrom: "2024-01-01 00:00:00.0"
                                periodTo: "2024-12-31 23:59:59.0"

  /publisering/list:
    get:
      summary: List publications (UI)
      description: Renders the HTML list view with optional filters and sorting. Mirrors `PubliseringController.list`.
      operationId: publiseringListView
      parameters:
        - in: query
          name: max
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: sort
          description: Field to sort by (default `tidspunkt`). When `statistikknavn`, sorting happens via nested association.
          schema:
            type: string
            default: tidspunkt
            enum: [tidspunkt, statistikknavn, dateCreated, id]
        - in: query
          name: order
          schema:
            type: string
            default: asc
            enum: [asc, desc]
        - in: query
          name: filter.seksjon
          description: Filter by owner section code (e.g. "350")
          schema: { type: string }
        - in: query
          name: filter.kortnavn
          description: Filter by `kortnavn` (LIKE)
          schema: { type: string }
        - in: query
          name: filter.initialer
          description: Filter by contact initials (LIKE)
          schema: { type: string }
      responses:
        '200':
          description: HTML list view
          content:
            text/html: {}

  /publisering/create:
    get:
      summary: Open create-publication form (UI)
      description: Renders the HTML form to create a publication. Mirrors `PubliseringController.create`.
      operationId: publiseringCreateForm
      parameters:
        - in: query
          name: statistikkId
          required: false
          description: Statistikk ID the new publication belongs to (`params.statistikk.id`)
          schema:
            type: integer
      responses:
        '200':
          description: HTML form
          content:
            text/html: {}
        '302':
          description: Redirect (statistic not approved)
          headers:
            Location:
              schema: { type: string }

  /publisering/delete:
    post:
      summary: Delete a publication (UI action)
      description: Deletes a publication and redirects. Mirrors `PubliseringController.delete` (POST).
      operationId: publiseringDelete
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Publisering ID to delete (`params.id`)
                statistikk:
                  type: integer
                  description: Optional Statistikk ID for redirect (`params.statistikk`)
              required: [id]
      responses:
        '303':
          description: See Other — redirect after delete
          headers:
            Location:
              schema: { type: string }
        '302':
          description: Redirect when not found or delete fails
          headers:
            Location:
              schema: { type: string }
  
  /publisering/edit:
    get:
      summary: Open edit-publication form (UI)
      description: Renders the HTML form to edit an existing publication. Mirrors `PubliseringController.edit`.
      operationId: publiseringEditForm
      parameters:
        - in: query
          name: id
          required: true
          description: Publisering ID to edit (`params.id`)
          schema:
            type: integer
      responses:
        '200':
          description: HTML form
          content:
            text/html: {}
        '302':
          description: Redirect (not found or not approved)
          headers:
            Location:
              schema: { type: string }
  
  /publisering/update:
    post:
      summary: Update a publication (UI action)
      description: Updates a publication and redirects. Mirrors `PubliseringController.update` (POST).
      operationId: publiseringUpdate
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                id:
                  type: integer
                  description: Publisering ID (`params.id`)
                version:
                  type: integer
                  description: Optimistic locking version (`params.version`)
                tidspunkt:
                  type: string
                  description: New publish timestamp (`params.tidspunkt`)
                internKommentar:
                  type: string
                  description: Internal comment
              required: [id]
      responses:
        '303':
          description: See Other — redirect after successful update
          headers:
            Location:
              schema: { type: string }
        '200':
          description: HTML edit view re-rendered with validation errors
          content:
            text/html: {}
        '302':
          description: Redirect when not found
          headers:
            Location:
              schema: { type: string }
  
  /publisering/versjoner:
    get:
      summary: Show audit versions for a publication (UI)
      description: Renders an HTML page grouping audit entries by version. Mirrors `PubliseringController.versjoner`.
      operationId: publiseringVersionsView
      parameters:
        - in: query
          name: id
          required: true
          description: Publisering ID (`params.id`)
          schema: { type: integer }
      responses:
        '200':
          description: HTML versions view
          content:
            text/html: {}
        '302':
          description: Redirect when not found
          headers:
            Location:
              schema: { type: string }

  /publisering/flytt:
    get:
      summary: Move publication to another variant (UI)
      description: Shows a UI to move a publication to a different variant. Mirrors `PubliseringController.flytt`.
      operationId: publiseringFlyttForm
      parameters:
        - in: query
          name: id
          required: true
          description: Publisering ID to move (`params.id`)
          schema:
            type: integer
      responses:
        '200':
          description: HTML view with variant list
          content:
            text/html: {}
        '302':
          description: Redirect (not found)
          headers:
            Location:
              schema: { type: string }

  /publisering/lagreVariant:
    post:
      summary: Change the variant of a publication (UI action)
      description: Assigns a different Variant to the publication and redirects. Mirrors `PubliseringController.lagreVariant` (POST).
      operationId: publiseringSaveVariant
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Publisering ID (`params.id`)
                version:
                  type: integer
                  description: Optimistic locking version (`params.version`)
                variant:
                  type: integer
                  description: Variant ID to assign (`params.variant`)
              required: [id, variant]
      responses:
        '303':
          description: See Other — redirect after success
          headers:
            Location:
              schema: { type: string }
        '200':
          description: HTML flytt view re-rendered with errors
          content:
            text/html: {}
        '302':
          description: Redirect when not found
          headers:
            Location:
              schema: { type: string }

  /publisering/hentHelligdagerSperredeOgPubliseringer:
    get:
      summary: Get holidays and publication-day summaries
      operationId: getHolidaysBlockedAndPublications
      description: Returns holidays and per-day summaries of proposed/approved publication counts for one or more months.
      parameters:
        - in: query
          name: mnd
          description: Month (1–12)
          schema: { type: integer, minimum: 1, maximum: 12 }
        - in: query
          name: ar
          description: Year (e.g. 2025)
          schema: { type: integer }
        - in: query
          name: antallMnd
          description: Number of months to include starting from (mnd, ar). If omitted, returns only (mnd, ar).
          schema: { type: integer, minimum: 1, maximum: 24 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  helligdager:
                    type: array
                    description: List of holiday date strings (format decided by server)
                    items:
                      type: string
                  publiseringsTidspunktSummer:
                    type: array
                    description: List of tuples [dateString, level] where level describes load (e.g. "maks")
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items:
                        oneOf:
                          - type: string
                          - type: string
              examples:
                example:
                  value:
                    helligdager:
                      - "2025-12-25"
                      - "2025-12-26"
                      - "2026-01-01"
                    publiseringsTidspunktSummer:
                      - ["2025-06-03", "middels"]
                      - ["2025-06-10", "maks"]

  /publisering/avvisDesk:
    post:
      summary: Reject a publication in Desk (UI action, placeholder)
      description: Mirrors `PubliseringController.avvisDesk`. Rejects a publication with an internal comment and redirects.
      operationId: publiseringAvvisDesk
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Publisering ID (`params.id`)
                internKommentar:
                  type: string
                  description: Internal comment explaining the rejection (`params.internKommentar`)
              required: [id, internKommentar]
      responses:
        '303':
          description: See Other — redirect after action
          headers:
            Location:
              description: Redirect target (typically `/publisering/list`)
              schema: { type: string }
        '200':
          description: Re-rendered page with validation errors (e.g., missing comment)

  /publisering/godkjennDesk:
    post:
      summary: Approve a publication in Desk (UI action, placeholder)
      description: Mirrors `PubliseringController.godkjennDesk`. Approves a publication and redirects.
      operationId: publiseringGodkjennDesk
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Publisering ID (`params.id`)
              required: [id]
      responses:
        '303':
          description: See Other — redirect after action
          headers:
            Location:
              schema: { type: string }

  /publisering/listDesk:
    get:
      summary: List publications awaiting Desk (UI view, placeholder)
      description: Mirrors `PubliseringController.listDesk`. Shows publications with `deskFlyt=FORSLAG`, not canceled.
      operationId: publiseringListDesk
      parameters:
        - in: query
          name: max
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [tidspunkt, statistikknavn, dateCreated, id]
            default: tidspunkt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: HTML list view

  /statistikk/list:
    get:
      summary: List statistics (UI)
      description: |
        Renders the HTML list view of all statistics with optional filters, pagination, and sorting.
        Mirrors `StatistikkController.list`.  
        This is the UI counterpart to `/statistics`, which provides the same data in JSON form.
      operationId: statistikkListView
      parameters:
        - in: query
          name: max
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: sort
          description: Field to sort by (default `statistikknavn`). When `kortnavn`, sorting happens on the nested `Kortnavn` association.
          schema:
            type: string
            default: statistikknavn
            enum: [statistikknavn, kortnavn, dateCreated, id]
        - in: query
          name: order
          schema:
            type: string
            default: asc
            enum: [asc, desc]
        - in: query
          name: filter.seksjon
          description: Filter by owner section code (e.g. "350")
          schema:
            type: string
        - in: query
          name: filter.kortnavn
          description: Filter by short name (`Kortnavn.navn`, LIKE)
          schema:
            type: string
        - in: query
          name: filter.initialer
          description: Filter by contact initials (LIKE)
          schema:
            type: string
      responses:
        '200':
          description: HTML list view
          content:
            text/html:
              schema:
                type: string
              examples:
                example:
                  value: |
                    <html>
                      <head><title>Statistikker</title></head>
                      <body>
                        <h1>Liste over statistikker</h1>
                        <!-- table with filters and pagination -->
                      </body>
                    </html>

  /statistikk/create:
    get:
      summary: Create statistikk (UI form)
      description: Renders the HTML create form. Mirrors `StatistikkController.create`.
      operationId: statistikkCreateView
      responses:
        '200':
          description: HTML create view
          content:
            text/html: {}

  /statistikk/delete:
    post:
      summary: Delete statistikk (UI action placeholder)
      description: Currently does not delete; sets a flash message and redirects to list. Mirrors `StatistikkController.delete` (POST).
      operationId: statistikkDelete
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: Not used by current implementation.
      responses:
        '303':
          description: See Other — redirect to list
          headers:
            Location:
              schema: { type: string }
  
  /statistikk/edit:
    get:
      summary: Edit statistikk (UI form)
      description: Renders the HTML edit view for a given statistikk. Mirrors `StatistikkController.edit`.
      operationId: statistikkEditView
      parameters:
        - in: query
          name: id
          required: true
          description: Statistikk ID (`params.id`)
          schema: { type: integer }
      responses:
        '200':
          description: HTML edit view
          content:
            text/html: {}
        '302':
          description: Redirect when not found
          headers:
            Location:
              schema: { type: string }

  /statistikk/update:
    post:
      summary: Update statistikk (UI action)
      description: Updates a statistikk and redirects. Mirrors `StatistikkController.update` (POST).
      operationId: statistikkUpdate
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                id:
                  type: integer
                  description: Statistikk ID
                version:
                  type: integer
                  description: Optimistic locking version
                eierseksjon:
                  type: string
                  description: Section ID
                kortnavn.navn:
                  type: string
                statistikk.internKommentar:
                  type: string
                statistikk.forstegangspublisering:
                  type: string
                statistikk.kontakter:
                  type: array
                  items: { type: string }
              required: [id]
      responses:
        '303':
          description: See Other — redirect after success
          headers:
            Location:
              schema: { type: string }
        '200':
          description: HTML edit view re-rendered with validation errors
          content:
            text/html: {}
        '302':
          description: Redirect when not found
          headers:
            Location:
              schema: { type: string }
  
  /statistikk/versjoner:
    get:
      summary: Show audit versions for a statistikk (UI)
      description: Renders an HTML page with grouped audit entries. Mirrors `StatistikkController.versjoner`.
      operationId: statistikkVersionsView
      parameters:
        - in: query
          name: id
          required: true
          description: Statistikk ID (`params.id`)
          schema: { type: integer }
      responses:
        '200':
          description: HTML versions view
          content:
            text/html: {}
        '302':
          description: Redirect when not found
          headers:
            Location:
              schema: { type: string }

  /statistikk/avvisDesk:
    post:
      summary: Reject a statistikk in Desk (UI action, placeholder)
      description: Mirrors `StatistikkController.avvisDesk`. Rejects with internal comment and redirects.
      operationId: statistikkAvvisDesk
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Statistikk ID (`params.id`)
                internKommentar:
                  type: string
                  description: Internal comment explaining the rejection (`params.internKommentar`)
              required: [id, internKommentar]
      responses:
        '303':
          description: See Other — redirect after action
          headers:
            Location:
              schema: { type: string }
        '200':
          description: Re-rendered page with validation errors (e.g., missing comment)

  /statistikk/godkjennDesk:
    post:
      summary: Approve a statistikk in Desk (UI action, placeholder)
      description: Mirrors `StatistikkController.godkjennDesk`. Approves and redirects.
      operationId: statistikkGodkjennDesk
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Statistikk ID (`params.id`)
              required: [id]
      responses:
        '303':
          description: See Other — redirect after action
          headers:
            Location:
              schema: { type: string }

  /statistikk/lagreVarianter:
    post:
      summary: Save one or more variants (UI action, placeholder)
      description: >
        Placeholder for `StatistikkController.lagreVarianter`. Intended to save or update
        multiple `Variant` records associated with a `Statistikk`. Exact payload TBD.
      operationId: statistikkSaveVariants
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              description: Form data for saving variants (structure TBD)
      responses:
        '302':
          description: Redirect after saving (typical Grails flow)
          headers:
            Location:
              schema: { type: string }
        '200':
          description: Re-rendered form with validation errors

  /statistikk/oppdaterVarianter:
    post:
      summary: Update variants helper (non-routable in current code, placeholder)
      description: >
        Listed in inventory but the current controller declares `oppdaterVarianter` as a helper closure
        that takes parameters `(params, variantInstanceList)` and is not exposed as an action.
        If later exposed via a proper action, replace this placeholder with the actual contract.
      operationId: statistikkOppdaterVarianter
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              description: Placeholder shape (TBD)
      responses:
        '200':
          description: Placeholder response

  /statistikk/show:
    get:
      summary: Show statistikk (UI view, placeholder)
      description: Mirrors `StatistikkController.show`. Displays a statistikk page.
      operationId: statistikkShow
      parameters:
        - in: query
          name: id
          required: true
          description: Statistikk ID (`params.id`)
          schema: { type: integer }
      responses:
        '200':
          description: HTML detail view
        '302':
          description: Redirect when not found
          headers:
            Location:
              schema: { type: string }
              
  /statistikk/slettVariant:
    post:
      summary: Delete a variant from a statistikk (UI action)
      description: Deletes a Variant and redirects. Mirrors `StatistikkController.slettVariant` (POST).
      operationId: statistikkDeleteVariant
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                variant.id:
                  type: integer
                  description: Variant ID to delete (`params.variant.id`)
              required: [variant.id]
      responses:
        '303':
          description: See Other — redirect to `/statistikk/show/{statistikkId}`
          headers:
            Location:
              schema: { type: string }
        '302':
          description: Redirect on not found or data integrity violation
          headers:
            Location:
              schema: { type: string }
  
  /statistikk/hentKortnavn:
    get:
      summary: Retrieve the list of kortnavn
      operationId: getKortnavn
      description: Returns a list of shortnames for all statistics (used in UI selectors and XML fetchers).
      responses:
        '200':
          description: List of kortnavn
          content:
            application/json:
              schema:
                type: object
                properties:
                  kortnavn:
                    type: array
                    items:
                      type: string
              examples:
                example:
                  value:
                    kortnavn:
                      - "utfono"
                      - "foun"
                      - "innov"
                      - "sti"
                      - "vti"
                      - "navn"
                      - "folkfram"
                      - "innvfram"
                      - "knr"
                      - "nr"

components:
  schemas:
    StatisticsResponse:
      type: object
      properties:
        statistics:
          type: array
          items:
            $ref: '#/components/schemas/StatisticItem'

    StatisticItem:
      type: object
      properties:
        id: { type: integer }
        shortName: { type: string }
        name: { type: string }
        nameEN: { type: string }
        modifiedTime: { type: string, description: 'lastUpdated as string' }
        status:
          type: string
          enum: [A, IA, UT, SA]
        variants:
          type: array
          description: Only non-discontinued variants (!erOpphort)
          items:
            $ref: '#/components/schemas/VariantItem'

    VariantItem:
      type: object
      properties:
        id: { type: integer }
        frekvens:
          type: string
          description: Human-readable frequency (e.g., "År", "Måned")
        previousRelease:
          type: string
          description: Timestamp of previous release, or empty string
        previousFrom:
          type: string
          description: Period start of previous release, or empty string
        previousTo:
          type: string
          description: Period end of previous release, or empty string
        nextRelease:
          type: string
          description: Timestamp of next release, or empty string
        nextReleaseId:
          oneOf:
            - type: integer
            - type: string
          description: Next release ID or empty string
        upcomingReleases:
          type: array
          description: From getUpcomingReleases(...). Empty array if none.
          items:
            $ref: '#/components/schemas/UpcomingRelease'

    UpcomingRelease:
      type: object
      description: Exact shape from getUpcomingReleases(...)
      properties:
        id: { type: integer }
        publishTime:
          type: string
          description: release.tidspunkt.toString()
        periodFrom:
          type: string
          description: release.periodeFra.toString()
        periodTo:
          type: string
          description: release.periodeTil.toString()
