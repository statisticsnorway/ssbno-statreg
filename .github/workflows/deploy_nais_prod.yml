name: Deploy to PROD
# Promotes the image already built by "Deploy to TEST" for the release tag's commit; nothing is rebuilt.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to deploy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v0.1.2 (for rollback/redeploy)
        type: string
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
        with:
          team: ssbno
      - name: Apply Postgres
        run: nais apply .nais/postgres.yaml --environment prod
      - name: Login to Nais registry
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        id: login
        with:
          team: ssbno
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ secrets.NAIS_MANAGEMENT_PROJECT_ID }}
      - name: Resolve image built for this commit
        id: image
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          image="$REGISTRY/$REPO_NAME:$(git rev-parse HEAD)"
          if ! digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}'); then
            echo "::error ::$image not found. Wait for 'Deploy to TEST' to finish for this commit, then re-run."
            exit 1
          fi
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy to Nais
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          TEAM: ssbno
          CLUSTER: prod
          RESOURCE: .nais/prod.yaml
          VAR: image=${{ steps.image.outputs.image }}
          DEPLOY_SERVER: deploy.ssb.cloud.nais.io:443
