name: Build and test
on:
  pull_request:
    branches: ["develop", "main"]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # placeholder URL, needed to generate client and build application
      PGURL: postgresql://user@localhost:5432/statreg_db
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
      - run: pnpm i
      - run: pnpm run generate
      - run: pnpm run build --if-present
      - run: pnpm run ci-test
      - run: pnpm run lint
      - run: pnpm run generate:api-types

      - name: Check match between generated api types and openapi spec
        # If api-types.ts has uncommited changes after the previous step (generate api-types)
        # that means that there is a mismatch between api-types and openapi spec
        run: |
          if ! git diff --exit-code ./shared/src/api-types.ts; then
            echo "❌ There's a mismatch between generated api types and openapi spec. Please run 'npm run generate:api-types' to update types, or revert changes to the spec."
            exit 1
          fi

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run integration tests
        run: docker compose -f docker-compose-test.yaml up --abort-on-container-exit --exit-code-from tests
