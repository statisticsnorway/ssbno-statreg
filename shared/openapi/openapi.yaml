openapi: 3.1.0
# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2022-10-07
info:
  title: Statreg API
  version: 0.1.0
  description: API for managing publications, statistics and metadata for Statistics Norway. This API is under development, and there will be breaking changes.
servers:
  - url: https://ssbno-statreg.intern.test.ssb.no/statistikkregisteret/api
  - url: http://localhost:8080/statistikkregisteret/api

tags:
  - name: calendar
    description: Helpers for calendar view and days that are blocked
  - name: contacts
    description: Contact persons for statistics
  - name: frequencies
    description: Frequencies for releases, ie. copled to variants of a statistic
  - name: releases
    description: Releases endpoints
  - name: statistics
    description: Statistics information and manipulation
  - name: shortnames
    description: Shortname for a statistic

security:
  - keykloak_token: []

components:
  securitySchemes:
    keykloak_token:
      type: http
      scheme: bearer
      description: A token granted by Statistics Norway's Keycloak instance for ssbno-statreg.

  parameters:
    Pagination_start:
      in: query
      name: start
      schema:
        type: integer
        default: 0
      description: Number of items skipped before starting the results list
    Pagination_count:
      in: query
      name: count
      schema:
        type: integer
        default: 10
      description: Maximum number of items returned
    Sort:
      in: query
      name: sort
      description: 'Sorting fields separated by comma. Default order is Ascending (ASC), minus(-) should be used in front of field name for Descending (DESC) order.'
      example: '-publish_time'
      schema:
        type: string
    Shortname_filter:
      in: query
      name: shortname
      description: Filter by shortname(s) separated by comma.
      example: 'ferie,reise'
      schema:
        type: string
    Contact_filter:
      in: query
      name: contact
      description: Filter by contact initial(s) separated by comma.
      example: 'abc,xyz'
      schema:
        type: string

  responses:
    FutureBlockedReleaseDays:
      description: List of future blocked release days. Includes all manually blocked days, but only automatically blocked days for the next three calendar years. Sorted from earliest to latest date.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Blocked_release_date' }

  schemas:
    Blocked_release_date:
      type: object
      required:
        - date
        - automatically_blocked
        - blocked_comment
      example: { date: '2026-12-24', automatically_blocked: false, blocked_comment: 'Christmas eve' }
      properties:
        date: { type: string, format: date }
        automatically_blocked: { type: boolean }
        blocked_comment: { type: string }

    Calender_date:
      type: object
      description: Map of ISO date (YYYY-MM-DD) to day information, ie status
      example:
        '2026-05-03':
          status: 'blocked'
        '2026-05-04':
          status: 'none'
        '2026-05-05':
          status: 'few'
      patternProperties:
        '^\d{4}-\d{2}-\d{2}$':
          type: object
          properties:
            status:
              type: string
              description: Can be one of "blocked", "none", "few", "many", "full"
          required:
            - status
      additionalProperties: false

    Contact:
      type: object
      required:
        - name
        - username
      properties:
        name: { type: string, readOnly: true }
        username: { type: string, readOnly: true }
        mobile: { type: string, format: mobile, readOnly: true }
        email: { type: string, format: email, readOnly: true }

    Frequency:
      type: object
      required:
        - name
        - code
      properties:
        name: { type: string }
        code: { type: string }

    Level_of_detail:
      description: 'Text field to specify variant beyond frequency and revision'
      type: object
      properties:
        name: { type: [string, null] }
        name_en: { type: [string, null] }

    Region_level:
      description: 'Valid region levels are (name in parethesis): L (Land), LD (Landsdel), F (Fylke), K (Kommune), BD (Bydel og krets)'
      type: object
      required:
        - code
        - name
      properties:
        code: { type: string }
        name: { type: string }

    Shortname_listing:
      description: 'Shortnames with its corresponding statistic name'
      type: object
      required:
        - shortname
        - statistic_name
      properties:
        shortname: { type: string }
        statistic_name: { type: string }

    Release_create:
      type: object
      properties:
        publish_time: { type: string, format: date-time }
        period_to: { type: string, format: date }
        period_from: { type: string, format: date }
        release_date_precision: { type: string }

    Release_update:
      allOf:
        - $ref: '#/components/schemas/Release_create'
        - type: object
          properties:
            comment: { type: string }

    Release_get:
      type: object
      required:
        - id
        - publish_time
        - period_to
        - period_from
        - approval_status
        - statistic
      properties:
        id: { type: integer, readOnly: true }
        publish_time: { type: string, format: date-time }
        period_to: { type: string, format: date }
        period_from: { type: string, format: date }
        approval_status: { type: [string, null] }
        statistic:
          type: object
          properties:
            shortname: { type: string, readOnly: true }
            name: { type: string, readOnly: true }
            name_en: { type: string, readOnly: true }
          required:
            - shortname
            - name

    Release_details:
      allOf:
        - $ref: '#/components/schemas/Release_get'
        - type: object
          required:
            - has_versions
            - variant
            - cancelled
            - release_date_precision
          properties:
            has_versions: { type: boolean }
            cancelled: { type: boolean }
            release_date_precision: { type: string }

    Release_listing:
      allOf:
        - $ref: '#/components/schemas/Release_get'
        - type: object
          required:
            - frequency
            - revision
          properties:
            frequency:
              $ref: '#/components/schemas/Frequency'
            revision:
              $ref: '#/components/schemas/Revision'

    Revision:
      description: 'Valid revision codes are:	I (Ingen), B (Beregnede), E (Endelige), F (Foreløpige), R (Reviderte), IG (Integrert)'
      type: object
      required:
        - code
      properties:
        code: { type: string }

    Division:
      type: object
      properties:
        code: { type: [string, null] }
        name: { type: string, readOnly: true }

    Statistic_create:
      type: object
      properties:
        name: { type: string }
        name_en: { type: string }
        main_language: { type: string, description: "Main language will be either 'nn' or 'nb' for statistics" }
        status:
          type: object
          properties:
            code: { type: string }
          required:
            - code
        division: { type: [string, null] }
        first_released_at: { type: [string, null], format: date }
        yearly_reporting: { type: boolean }
        statistic_region_levels:
          type: array
          items: { $ref: '#/components/schemas/Region_level' }
        previous_topic_codes: { type: [string, null] }
        comment: { type: string }

    Statistic_update:
      allOf:
        - $ref: '#/components/schemas/Statistic_create'
        - type: object
          properties:
            relation: { type: [string, null] }

    Statistic_listing:
      type: object
      required:
        - shortname
        - main_language
        - status
        - name
        - name_en
        - division
        - contacts
      properties:
        shortname: { type: string, readOnly: true }
        main_language: { type: string, description: "Main language will be either 'nn' or 'nb' for statistics" }
        status:
          type: object
          properties:
            code: { type: string }
          required:
            - code
        name: { type: string }
        name_en: { type: string }
        approval_status: { type: string, description: " Is one of 'GODKJENT', 'AVVIST' or 'FORSLAG'" }
        division:
          $ref: '#/components/schemas/Division'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'

    Statistic_details:
      allOf:
        - $ref: '#/components/schemas/Statistic_listing'
        - type: object
          required:
            - version
            - yearly_reporting
            - updated_at
            - comment
            - created_at
            - variants
            - statistic_region_levels
          properties:
            version: { type: integer }
            first_released_at: { type: [string, null], format: date }
            yearly_reporting: { type: boolean }
            previous_topic_codes: { type: [string, null] }
            relation:
              type:
                - object
                - null
              properties:
                shortname: { type: string }
                name: { type: string, readOnly: true }
                name_en: { type: string, readOnly: true }
              required:
                - shortname
                - name
            updated_at: { type: string, format: date-time, readOnly: true }
            comment: { type: string }
            created_at: { type: string, format: date-time, readOnly: true }
            variants:
              type: array
              items: { $ref: '#/components/schemas/Variant' }
            statistic_region_levels:
              type: array
              items:
                $ref: '#/components/schemas/Region_level'

    Variant_listing:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        frequency:
          $ref: '#/components/schemas/Frequency'
        revision:
          $ref: '#/components/schemas/Revision'
      required:
        - id
        - frequency
        - revision

    Variant:
      properties:
        allOf:
          - $ref: '#/components/schemas/Variant_simple'
          - type: object
            required:
              - updated_at
              - level_of_detail
              - created_at
              - cancelled
            version: { type: integer }
            updated_at: { type: string, format: date-time, readOnly: true }
            level_of_detail:
              $ref: '#/components/schemas/Level_of_detail'
            created_at: { type: string, format: date-time, readOnly: true }
            cancelled: { type: boolean }

paths:
  /contacts:
    get:
      summary: List of all contacts
      security: []
      tags: [contacts]
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
  /shortnames:
    get:
      summary: List of all existing shortnames
      security: []
      tags: [shortnames]
      responses:
        '200':
          description: List of shortnames
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shortname_listing'
  /statistics:
    get:
      summary: List of all statistics
      security: []
      tags: [statistics]
      parameters:
        - $ref: '#/components/parameters/Pagination_start'
        - $ref: '#/components/parameters/Pagination_count'
        - $ref: '#/components/parameters/Shortname_filter'
        - $ref: '#/components/parameters/Contact_filter'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  statistics:
                    type: array
                    items: { $ref: '#/components/schemas/Statistic_listing' }

  /statistics/{shortname}:
    get:
      summary: Get a statistic by its shortname
      security: []
      tags: [statistics]
      parameters:
        - name: shortname
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Statistic details with all its variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistic_details' }
    post:
      summary: Create a new statistic
      tags: [statistics]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Statistic_create' }
      responses:
        '201':
          description: Statistic details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistic_details' }
    put:
      summary: Update a statistic
      tags: [statistics]
      parameters:
        - name: shortname
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Statistic_update' }
      responses:
        '200':
          description: Updated statistic details with all its variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistic_details' }

  /statistics/{shortname}/variants:
    post:
      summary: Create a variant on a spesific statistic
      tags: [statistics]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Variant' }
      responses:
        '201':
          description: The created variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
  /statistics/{shortname}/variants/{id}:
    put:
      summary: Update a variant
      tags: [statistics]
      parameters:
        - name: shortname
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Variant' }
      responses:
        '200':
          description: Updated variant details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
  /statistics/{shortname}/variants/{id}/releases:
    get:
      summary: List all releases for one variant
      security: []
      tags: [statistics]
      parameters:
        - name: shortname
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/Pagination_start'
        - $ref: '#/components/parameters/Pagination_count'
      responses:
        '200':
          description: List of releases based on variant
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  releases:
                    type: array
                    items: { $ref: '#/components/schemas/Release_listing' }
    post:
      summary: Create a new release
      tags: [statistics]
      parameters:
        - name: shortname
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Release_create' }
      responses:
        '201':
          description: Release details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release_details' }
  /statistics/{shortname}/versions:
    get:
      summary: List all versions with changes and comment. Response object TBD
      tags: [statistics]
      responses:
        '200':
          description: List of versions. Response object TBD
          content:
            application/json:
              schema: {}

  /releases:
    get:
      summary: List all releases. Filter and sorting can be specified using query params
      security: []
      tags: [releases]
      parameters:
        - $ref: '#/components/parameters/Pagination_start'
        - $ref: '#/components/parameters/Pagination_count'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Shortname_filter'
        - in: query
          name: publish_time_after
          description: Filter releases with publish_time after the specified time given in ISO format.
          example: '2026-05-06T06:00:00Z'
          schema:
            type: string
            format: date-time
        - in: query
          name: publish_time_before
          description: Filter releases with publish_time before the specified timestamp in ISO format.
          example: '2026-05-06T06:00:00Z'
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of releases
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  releases:
                    type: array
                    items: { $ref: '#/components/schemas/Release_listing' }
  /releases/{id}:
    get:
      summary: Get release by id
      security: []
      tags: [releases]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Release details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release_details' }
    put:
      summary: Update a release
      tags: [releases]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Release_update' }
      responses:
        '200':
          description: Updated release details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release_details' }
  /releases/{id}/versions:
    get:
      summary: List all versions on a release with change and comment. Response object TBD
      tags: [releases]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of versions. Response object TBD
          content:
            application/json:
              schema: {}

  /frequencies:
    get:
      summary: List all frequencies
      tags: [frequencies]
      responses:
        '200':
          description: List of frequencies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Frequency' }

  /calendar:
    get:
      summary: Get status for all days in a period
      security: []
      tags: [calendar]
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
            description: 'Defaults to first day of current month'
            example: '2025-04-01'
        - name: toDate
          in: query
          schema:
            type: string
            format: date
            description: 'Defaults to end of second next month'
            example: '2025-04-27'
      responses:
        '200':
          description: Object with days in range and their status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calender_date' }

  /calendar/blocked-release-days:
    get:
      summary: Get list of future blocked release days
      tags: [calendar]
      responses:
        '200':
          $ref: '#/components/responses/FutureBlockedReleaseDays'
  /calendar/blocked-release-days/{date}:
    post:
      summary: Manually block a day
      tags: [calendar]
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blocked_comment:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/FutureBlockedReleaseDays'
    delete:
      summary: Delete a manually blocked day
      tags: [calendar]
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Updated list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Blocked_release_date' }
  /auth/authenticate:
    get:
      summary: Check authentication status and information for current user. Used for controlling front-end behaviour, not security.
      tags: [authentication]
      responses:
        '200':
          description: Object with admin-status, user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  isAdmin:
                    type: boolean
                    example: true
                  email:
                    type: string
                    example: alice@example.com
                  fullName:
                    type: string
                    example: Alice Examplesdottir
